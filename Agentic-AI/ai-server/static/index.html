
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic AI Assistant</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 25px;
}
.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
h1 { text-align: center; }
input, button, textarea {
    padding: 12px;
    margin: 7px 0;
    box-sizing: border-box;
}
input, textarea {
    width: 100%;
}
button {
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
}
#chat {
    height: 350px;
    overflow-y: auto;
    border: 1px solid #ddd;
    padding: 12px;
    margin: 15px 0;
}
.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    white-space: pre-wrap;
}
.user { background: #dbeafe; }
.assistant { background: #dcfce7; }
.status { color: #555; }
</style>
</head>
<body>
<div class="container">
<h1>Agentic AI Assistant</h1>

<label>API Key</label>
<input type="password" id="apiKey"
placeholder="Enter your API key">

<h3>Upload PDF</h3>
<input type="file" id="pdfFile" accept=".pdf">
<button onclick="uploadPDF()">Upload PDF</button>
<p id="uploadStatus" class="status"></p>

<hr>

<h3>Chat with AI</h3>
<div id="chat"></div>

<textarea id="message"
placeholder="Ask something about your PDF or the web..."
rows="3"></textarea>

<button onclick="sendMessage()">Send Message</button>
<button onclick="clearChat()">Clear Chat</button>
</div>

<script>
let messages = [];

function addMessage(role, content) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent =
        (role === "user" ? "You: " : "AI: ") + content;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function getKey() {
    return document.getElementById("apiKey").value.trim();
}

async function sendMessage() {
    const input = document.getElementById("message");
    const content = input.value.trim();

    if (!content) return;
    if (!getKey()) {
        alert("Please enter your API key.");
        return;
    }

    messages.push({
        role: "user",
        content: content
    });

    addMessage("user", content);
    input.value = "";

    try {
        const response = await fetch("/agent/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-api-key": getKey()
            },
            body: JSON.stringify({
                messages: messages
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Request failed");
        }

        const answer = data.answer || JSON.stringify(data);

        messages.push({
            role: "assistant",
            content: answer
        });

        addMessage("assistant", answer);

    } catch (error) {
        addMessage("assistant", "Error: " + error.message);
    }
}

async function uploadPDF() {
    const fileInput = document.getElementById("pdfFile");
    const status = document.getElementById("uploadStatus");

    if (!getKey()) {
        status.textContent = "Enter your API key first.";
        return;
    }

    if (!fileInput.files.length) {
        status.textContent = "Choose a PDF first.";
        return;
    }

    const file = fileInput.files[0];

    if (file.size > 10 * 1024 * 1024) {
        status.textContent = "PDF must be smaller than 10 MB.";
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    status.textContent = "Uploading...";

    try {
        const response = await fetch("/documents/upload", {
            method: "POST",
            headers: {
                "x-api-key": getKey()
            },
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Upload failed");
        }

        status.textContent = "PDF uploaded successfully!";
    } catch (error) {
        status.textContent = "Error: " + error.message;
    }
}

function clearChat() {
    messages = [];
    document.getElementById("chat").innerHTML = "";
}
</script>
</body>
</html>
